apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
ext {
    cameraX = '1.4.2'
    opencv = '4.12.0.1'
    appcompat = '1.5.1'
    constraintlayout = '2.1.4'
    lifecycle = '2.5.1'
    jmrtd = '0.7.42'
    scuba = '0.0.23'
    bouncy_castle = '1.80'
    junit = '4.13.2'
    scanEngine = '1.0.0'
}

// Per-machine settings (never committed): apps/android/local.properties
//   attest.backendKid=...        attest.backendPubKey=<SPKI base64>   (scripts/fetch-backend-key.sh writes both)
def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def backendKid = local.getProperty('attest.backendKid', '')
def backendPubKey = local.getProperty('attest.backendPubKey', '')

android {
    namespace 'ch.attest.onboarding'
    compileSdkVersion 35

    defaultConfig {
        applicationId "ch.attest.onboarding"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // risk backend: payloads are sealed to this P-256 public key (SPKI, base64), from local.properties
        buildConfigField "String", "BACKEND_KID", "\"${backendKid}\""
        buildConfigField "String", "BACKEND_PUBKEY", "\"${backendPubKey}\""
        // attest API base (-PattestBackend=...); empty = keep sealed payloads in the on-device outbox (no network)
        buildConfigField "String", "BACKEND_BASE", "\"${project.findProperty('attestBackend') ?: ''}\""
        // Play Integrity cloud project number; 0 = not configured
        buildConfigField "long", "PLAY_CLOUD_PROJECT", "0L"
    }

    buildTypes {
        debug {
            // presenter build: verbose view available (toggle on home and on every capture screen)
            buildConfigField "boolean", "DEFAULT_STAGE", "true"
            buildConfigField "boolean", "ALLOW_PRESENTER", "true"
            // attest Edge Function on local Supabase. Default: USB via `pnpm phone:usb` (adb reverse 54321).
            // Wi-Fi: ./gradlew assembleDebug -PattestBackend=http://<lan-ip>:54321/functions/v1/attest/api/v1
            // Hosted: -PattestBackend=https://<project-ref>.supabase.co/functions/v1/attest/api/v1
            buildConfigField "String", "BACKEND_BASE", "\"${project.findProperty('attestBackend') ?: 'http://127.0.0.1:54321/functions/v1/attest/api/v1'}\""
        }
        release {
            minifyEnabled false
            // production build: signals are collected silently, applicants only see guidance.
            // The verbose view does not exist here, so nobody holding the app can turn it on.
            buildConfigField "boolean", "DEFAULT_STAGE", "false"
            buildConfigField "boolean", "ALLOW_PRESENTER", "false"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/*.md', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

// jmrtd pulls the jdk18on BouncyCastle; the scanning engine uses jdk15to18
configurations.all {
    exclude group: "org.bouncycastle", module: "bcprov-jdk18on"
    exclude group: "org.bouncycastle", module: "bcutil-jdk18on"
    exclude group: "org.bouncycastle", module: "bcpkix-jdk18on"
    exclude group: "androidx.camera", module: "camera-video"
}

dependencies {
    // document + face scanning engine
    implementation "ch.digitaltrust.engine:scan-engine:${scanEngine}"

    implementation "org.opencv:opencv-android:${opencv}"

    implementation "androidx.camera:camera-core:${cameraX}"
    implementation "androidx.camera:camera-camera2:${cameraX}"
    implementation "androidx.camera:camera-lifecycle:${cameraX}"
    implementation "androidx.camera:camera-view:${cameraX}"

    implementation "androidx.appcompat:appcompat:${appcompat}"
    implementation "androidx.constraintlayout:constraintlayout:${constraintlayout}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${lifecycle}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

    // on-device OCR for the MRZ and the card title
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // standard ICAO 9303 data-group parsing + CMS for Passive Authentication
    implementation "org.jmrtd:jmrtd:${jmrtd}"
    implementation "net.sf.scuba:scuba-sc-android:${scuba}"
    implementation "org.bouncycastle:bcprov-jdk15to18:${bouncy_castle}"
    implementation "org.bouncycastle:bcutil-jdk15to18:${bouncy_castle}"
    implementation "org.bouncycastle:bcpkix-jdk15to18:${bouncy_castle}"

    // device attestation: Play Integrity token (verdict decrypted server-side)
    implementation 'com.google.android.play:integrity:1.4.0'

    testImplementation "junit:junit:${junit}"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
