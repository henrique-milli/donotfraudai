<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DoNotFraudAI · Pitch slides</title>
  <link rel="icon" href="assets/img/shield.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/explode.css" />
  <link rel="stylesheet" href="assets/css/console.css" />
  <link rel="stylesheet" href="assets/css/slides.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b1230; overflow: hidden; }
    #deck { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
    #deck > .sl { position: absolute; inset: 0; }
    .hud { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; font: 600 13px Inter, sans-serif; color: #c9d3ee; opacity: 0; transition: opacity 0.3s; }
    body:hover .hud { opacity: 1; }
    .hud button { font: inherit; color: #fff; background: rgba(255,255,255,0.12); border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    .hud span { min-width: 150px; text-align: center; }
  </style>
</head>
<body>
  <div id="deck"></div>
  <div class="hud">
    <button data-a="prev">←</button><span id="label"></span><button data-a="next">→</button>
    <button data-a="replay">Replay</button><button data-a="fs">Fullscreen (F)</button>
  </div>
  <script type="module">
    import { SLIDES, mountSlide } from './assets/js/slides-core.js';
    const deck = document.getElementById('deck');
    const label = document.getElementById('label');
    let idx = Math.max(0, Math.min(SLIDES.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
    let api, start = 0, offset = 0;

    function fit() {
      const s = Math.min(innerWidth / 1920, innerHeight / 1080);
      deck.style.transform = `scale(${s}) translate(-50%, -50%)`;
    }
    function show(i, at = 0) {
      idx = (i + SLIDES.length) % SLIDES.length;
      deck.innerHTML = '<div></div>';
      api = mountSlide(deck.firstChild, SLIDES[idx].id);
      offset = at; start = performance.now();
      label.textContent = `${idx + 1}/${SLIDES.length} · ${SLIDES[idx].label}`;
      history.replaceState(null, '', `#${idx + 1}`);
    }
    const now = () => offset + (performance.now() - start) / 1000;
    // ?t=4.5 freezes the slide at that second (handy for stills and QA).
    const freeze = new URLSearchParams(location.search).get('t');
    function tick() { if (api) api.render(Math.min(freeze != null ? +freeze : now(), api.duration)); requestAnimationFrame(tick); }

    // Space / ↓ jumps to the next explode step; → / ← change slides.
    function stepForward() {
      const t = now();
      if (api.duration - t > 0.5 && ['doc', 'face'].includes(SLIDES[idx].id)) {
        const next = (Math.floor(t / 3.2) + 1) * 3.2;
        if (next < api.duration) { offset = next; start = performance.now(); return; }
      }
      show(idx + 1);
    }
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') show(idx + 1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(idx - 1);
      else if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); stepForward(); }
      else if (e.key === 'r') show(idx);
      else if (e.key === 'f') document.documentElement.requestFullscreen?.();
    });
    document.querySelector('.hud').addEventListener('click', e => {
      const a = e.target.dataset.a;
      if (a === 'prev') show(idx - 1);
      if (a === 'next') show(idx + 1);
      if (a === 'replay') show(idx);
      if (a === 'fs') document.documentElement.requestFullscreen?.();
    });
    addEventListener('resize', fit);
    fit(); show(idx); tick();
  </script>
</body>
</html>
